    const F1EngineAudio = {
      ctx: null,
      osc1: null,
      osc2: null,
      gainNode: null,
      filter: null,
      isRevving: false,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },

      playBeep(freq = 880, duration = 0.08, type = "sine") {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },

      playRadioBeep() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          this.playBeep(1200, 0.05, "sine");
          setTimeout(() => this.playBeep(1800, 0.08, "sine"), 60);
        } catch(e) {}
      },

      playDrsWhoosh() {
        this.init();
        if (!this.ctx) return;
        try {
          const bufferSize = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(800, this.ctx.currentTime);
          filter.frequency.exponentialRampToValueAtTime(3200, this.ctx.currentTime + 0.4);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e) {}
      },

      playDownshiftPop() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(now + 0.12);
        } catch(e) {}
      },

      playCheerFanfare() {
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.1, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + i * 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + 0.6 + i * 0.1);
          });
        } catch(e) {}
      }
    };

      // ==========================================
      // WOW FEATURE 1: ANIMATED CANVAS RACING ENGINE
      // ==========================================
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let angle = 0;
        let running = true;

        const renderTrack = () => {
          if (!canvas) return;
          const w = canvas.width;
          const h = canvas.height;

          ctx.clearRect(0, 0, w, h);

          // Draw Dark Track Background
          ctx.fillStyle = "#0d131d";
          ctx.fillRect(0, 0, w, h);

          // Draw Track Grid Lines
          ctx.strokeStyle = "rgba(255,255,255,0.03)";
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 30) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
          }
          for (let y = 0; y < h; y += 30) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
          }

          // Oval Track Path
          const centerX = w / 2;
          const centerY = h / 2;
          const radiusX = w * 0.38;
          const radiusY = h * 0.32;

          // Draw Asphalt Track Boundary
          ctx.beginPath();
          ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.lineWidth = 26;
          ctx.strokeStyle = "#1e293b";
          ctx.stroke();

          // Draw Racing Line
          ctx.beginPath();
          ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#38bdf8";
          ctx.setLineDash([8, 8]);
          ctx.stroke();
          ctx.setLineDash([]);

          // DRS Zone Highlight
          ctx.beginPath();
          ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, Math.PI * 0.1, Math.PI * 0.6);
          ctx.lineWidth = 6;
          ctx.strokeStyle = drsActive ? "#22c55e" : "rgba(34, 197, 94, 0.3)";
          ctx.stroke();

          // Calculate Car Position along Oval
          if (raceState === 'RACING') {
            angle += 0.02 * simSpeed;
            if (angle >= Math.PI * 2) {
              angle = 0;
              setLap(l => l + 1);
              F1EngineAudio.playBeep(1100, 0.06);
            }
          }

          const carX = centerX + Math.cos(angle) * radiusX;
          const carY = centerY + Math.sin(angle) * radiusY;

          // Check DRS zone
          const isDrsAngle = (angle >= Math.PI * 0.1 && angle <= Math.PI * 0.6);
          if (isDrsAngle !== drsActive) {
            setDrsActive(isDrsAngle);
            if (isDrsAngle) F1EngineAudio.playDrsWhoosh();
          }

          // Calculate speed dynamically based on cornering
          const tangentSpeed = isDrsAngle ? selectedTrack.topSpeedKmh : selectedTrack.topSpeedKmh * (0.65 + Math.sin(angle * 2) * 0.25);
          const currentSpeed = Math.floor(tangentSpeed * (tireWearPercent / 100));
          setCarSpeedKmh(currentSpeed);
          setRpm(Math.floor(currentSpeed * 35 + 3000));
          setGear(Math.min(8, Math.max(1, Math.floor(currentSpeed / 42) + 1)));

          // Draw Shadow
          ctx.beginPath();
          ctx.arc(carX + 4, carY + 4, 12, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fill();

          // Draw F1 Car Marker
          ctx.beginPath();
          ctx.arc(carX, carY, 10, 0, Math.PI * 2);
          ctx.fillStyle = selectedTeam.color;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          // Car Number Text
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 9px Orbitron, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(selectedDriver.number, carX, carY);

          // Draw DRS Indicator Aura
          if (isDrsAngle) {
            ctx.beginPath();
            ctx.arc(carX, carY, 18, 0, Math.PI * 2);
            ctx.strokeStyle = "#22c55e";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          if (running) {
            animFrameRef.current = requestAnimationFrame(renderTrack);
          }
        };

        renderTrack();

        return () => {
          running = false;
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
        };

                      </div>

                      <div className="bg-f1dark p-3 rounded-2xl border border-f1border">
                        <span className="text-[9px] text-slate-400 block">ERS BATTERY</span>
                        <div className="flex items-baseline justify-between mt-1">
                          <span className="text-lg font-black text-cyan-400">{ersPercent}%</span>
                          <span className="text-[10px] text-cyan-400">HARVEST</span>
                        </div>
                        <div className="w-full h-1.5 bg-slate-800 rounded-full mt-2 overflow-hidden">
                          <div className="h-full bg-cyan-400" style={{ width: `${ersPercent}%` }}></div>
                        </div>
                      </div>

                      <div className="bg-f1dark p-3 rounded-2xl border border-f1border">
                        <span className="text-[9px] text-slate-400 block">PIT STRATEGY</span>
                        <button
                          onClick={performPitStop}
                          className="mt-1 w-full py-1.5 bg-f1red hover:bg-red-500 text-white font-racing font-black text-[10px] rounded-xl transition-all shadow uppercase"
                        >
                          BOX NOW (2.3s)
                        </button>
                      </div>
                    </div>

                  </div>

                  {/* RACE ENGINEER LOGS */}
                  <div className="bg-f1card p-4 rounded-3xl border border-f1border shadow-xl flex flex-col gap-2">
                    <span className="text-xs font-racing font-bold text-slate-300 uppercase flex items-center gap-2">
                      <i className="fa-solid fa-list-check text-emerald-400"></i> REAL-TIME RACE LOGS
                    </span>
                    <div className="bg-f1dark p-3 rounded-2xl border border-f1border h-32 overflow-y-auto font-mono text-xs flex flex-col gap-1">
                      {raceLogs.map((log, idx) => (
                        <p key={idx} className="text-slate-300 leading-relaxed"><span className="text-f1red font-bold">›</span> {log}</p>
                      ))}
                      {raceLogs.length === 0 && <p className="text-slate-500 italic">No race events logged yet. Press START RACE above!</p>}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: PIT STOP MINIGAME */}
              {activeTab === 'PIT_MINIGAME' && (
                <div className="bg-f1card p-6 rounded-3xl border border-f1border shadow-2xl flex flex-col items-center justify-center gap-6 min-h-[400px] text-center">
                  <div className="max-w-md flex flex-col items-center gap-3">
                    <span className="text-4xl">🛠️</span>
                    <h2 className="text-2xl font-racing font-black text-white uppercase">WHEEL GUN REACTION MINIGAME</h2>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Test your reaction time as Chief Pit Crew member! Click <strong className="text-f1red">RELEASE CAR</strong> the millisecond the lights turn GREEN!
                    </p>
                  </div>

                  {!pitMinigameActive ? (
                    <button
                      onClick={triggerPitMinigame}
                      className="px-8 py-4 bg-f1red hover:bg-red-500 text-white font-racing font-black text-sm rounded-2xl glow-red transition-all cursor-pointer shadow-xl uppercase tracking-widest"
                    >
                      ENTER PIT LANE
                    </button>
                  ) : (
                    <div className="flex flex-col items-center gap-4 w-full max-w-sm">
                      {pitStage === 'WAITING' && (
                        <div className="p-8 bg-amber-500/10 border-2 border-amber-500 rounded-3xl w-full animate-pulse">
                          <span className="text-xl font-racing font-black text-amber-400 uppercase">WAIT FOR GREEN LIGHTS...</span>
                        </div>
                      )}

                      {pitStage === 'PRESS_NOW' && (
                        <button
                          onClick={handlePitReactionPress}
                          className="w-full p-10 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-racing font-black text-2xl rounded-3xl shadow-2xl animate-bounce cursor-pointer uppercase"
                        >
                          RELEASE NOW!
                        </button>
                      )}

                      {pitStage === 'DONE' && (
                        <div className="p-6 bg-slate-900 border border-f1border rounded-3xl w-full flex flex-col gap-3">
                          <span className="text-xs font-mono text-slate-400 uppercase">OFFICIAL PIT STOP TIME</span>
                          <span className="text-3xl font-racing font-black text-emerald-400">{pitTimeSec} SEC</span>
                          <button
                            onClick={triggerPitMinigame}
                            className="mt-2 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition-all"
                          >
                            TRY AGAIN
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* TAB 3: REPLAY LAB WITH 5 CAMERA VIEWS */}
              {activeTab === 'REPLAY_LAB' && (
                <div className="bg-f1card p-6 rounded-3xl border border-f1border shadow-2xl flex flex-col gap-5">
                  <div className="flex items-center justify-between border-b border-f1border pb-3">
                    <div>
                      <h3 className="text-lg font-racing font-black text-white uppercase">GRAND PRIX REPLAY LAB</h3>
                      <p className="text-xs text-slate-400">Select camera perspective to re-examine historical race telemetry.</p>
                    </div>
                    <span className="px-3 py-1 bg-f1red/20 text-f1red border border-f1red/30 rounded-full font-mono text-xs font-bold">MULTICAM ACTIVE</span>
                  </div>

                  {/* 5 Camera Views */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 font-racing">
                    {[
                      { id: 'COCKPIT_3D', label: '🎥 COCKPIT CAM' },
                      { id: 'HELICOPTER_2D', label: '🚁 HELI TRACK' },
                      { id: 'TELEMETRY_GRAPH', label: '📈 DATA SPECS' },
                      { id: 'PIT_WALL', label: '🏁 PIT WALL' },
                      { id: 'CHASE_CAM', label: '🏎️ CHASE CAM' }
                    ].map(vw => (
                      <button
                        key={vw.id}
                        onClick={() => { setReplayView(vw.id); F1EngineAudio.playBeep(600, 0.04); }}
                        className={`p-2.5 rounded-xl text-[10px] font-bold transition-all border ${replayView === vw.id ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-md font-black' : 'bg-f1dark text-slate-400 border-f1border hover:text-white'}`}
                      >
                        {vw.label}
                      </button>
                    ))}
                  </div>

                  {/* Replay Viewport */}
                  <div className="aspect-video w-full bg-f1dark rounded-2xl border border-f1border p-6 flex flex-col items-center justify-center relative overflow-hidden">
                    <div className="absolute inset-0 scanline opacity-30 pointer-events-none"></div>

                    {replayView === 'COCKPIT_3D' && (
                      <div className="flex flex-col items-center gap-3 text-center">
                        <span className="text-5xl">🏎️</span>
                        <h4 className="text-lg font-racing font-bold text-cyan-400">DRIVER COCKPIT PERSPECTIVE</h4>
                        <p className="text-xs text-slate-400 max-w-md">Steering wheel LED rev lights flickering at 14,800 RPM. Apex speed: 285 KM/H.</p>
                      </div>
                    )}

                    {replayView === 'HELICOPTER_2D' && (
                      <div className="flex flex-col items-center gap-3 text-center">
                        <span className="text-5xl">🚁</span>
                        <h4 className="text-lg font-racing font-bold text-emerald-400">HELICOPTER TRACK OVERHEAD</h4>
                        <p className="text-xs text-slate-400 max-w-md">Tracking Turn 1 insertion gap between {selectedDriver.name} and lead car.</p>
                      </div>
                    )}

                    {replayView === 'TELEMETRY_GRAPH' && (
                      <div className="flex flex-col items-center gap-3 text-center">
                        <span className="text-5xl">📈</span>
                        <h4 className="text-lg font-racing font-bold text-amber-400">TELEMETRY & SPEED SPECTRUM</h4>
                        <p className="text-xs text-slate-400 max-w-md">Throttle: 100% | Brake Pressure: 0 bar | Lateral G-Force: 4.8G</p>
                      </div>
                    )}

                    {replayView === 'PIT_WALL' && (
                      <div className="flex flex-col items-center gap-3 text-center">
                        <span className="text-5xl">🏁</span>
                        <h4 className="text-lg font-racing font-bold text-f1red">PIT WALL STRATEGY MONITORS</h4>
                        <p className="text-xs text-slate-400 max-w-md">Weather radar clean. Gap to pit window: +21.4 seconds.</p>
                      </div>
                    )}

                    {replayView === 'CHASE_CAM' && (
                      <div className="flex flex-col items-center gap-3 text-center">
                        <span className="text-5xl">💨</span>
                        <h4 className="text-lg font-racing font-bold text-purple-400">REAR WING CHASE CAMERA</h4>
                        <p className="text-xs text-slate-400 max-w-md">DRS flap deployed. Slipstream overtake velocity delta: +14 KM/H.</p>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 4: AI RACE ENGINEER RADIO (GEMINI API) */}
              {activeTab === 'AI_ENGINEER' && (
                <div className="bg-f1card p-6 rounded-3xl border border-f1border shadow-2xl flex flex-col gap-5">
                  <div className="flex items-center justify-between border-b border-f1border pb-3">
                    <div>
                      <h3 className="text-lg font-racing font-black text-white uppercase">AI RACE ENGINEER TERMINAL</h3>
                      <p className="text-xs text-slate-400">Gemini LLM real-time radio comms and strategy generator.</p>
                    </div>
                    
                    {/* Model Selector */}
                    <select
                      value={aiModel}
                      onChange={(e) => setAiModel(e.target.value)}
                      className="bg-f1dark text-xs font-mono font-bold text-amber-400 border border-f1border rounded-xl px-3 py-1.5 focus:outline-none"
                    >
                      <option value="gemini-3.1-flash">Gemini 3.1 Flash (Default)</option>
                      <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
                      <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                      <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    </select>
                  </div>

                  {/* Radio Prompt Directives */}
                  <div className="flex flex-col gap-2">
                    <label className="text-xs font-mono font-bold text-slate-400 uppercase">CUSTOM RADIO DIRECTIVE / PROMPT MODIFIER</label>
                    <input
                      type="text"
                      value={customPromptDirective}
                      onChange={(e) => setCustomPromptDirective(e.target.value)}
                      placeholder="e.g. Advise me on wet weather transition strategy and wing angle adjustment..."
                      className="bg-f1dark border border-f1border rounded-xl p-3 text-xs text-white placeholder:text-slate-600 focus:outline-none focus:border-f1red font-mono"
                    />
                  </div>

                  <button
                    onClick={consultAiEngineer}
                    disabled={isConsultingAi}
                    className="w-full py-3 bg-f1red hover:bg-red-500 disabled:opacity-50 text-white font-racing font-black text-xs rounded-xl glow-red transition-all shadow-lg flex items-center justify-center gap-2 uppercase tracking-wider cursor-pointer"
                  >
                    <i className="fa-solid fa-radio"></i>
                    <span>{isConsultingAi ? 'CONNECTING RADIO...' : 'TRANSMIT RADIO MESSAGE'}</span>
                  </button>

                  {/* AI Response Display */}
                  {aiRadioResponse && (
                    <div className="p-4 bg-f1dark border-l-4 border-f1red rounded-2xl flex flex-col gap-2">
                      <span className="text-[10px] font-mono font-bold text-f1red uppercase">📻 PIT WALL RADIO TRANSMISSION</span>
                      <p className="text-xs font-mono text-slate-200 leading-relaxed italic">{aiRadioResponse}</p>
                    </div>
                  )}
                </div>
              )}

              {/* TAB 5: LEGENDS WISDOM TERMINAL */}
              {activeTab === 'LEGENDS' && (
                <div className="bg-f1card p-6 rounded-3xl border border-f1border shadow-2xl flex flex-col gap-5">
                  <div className="border-b border-f1border pb-3">
                    <h3 className="text-lg font-racing font-black text-white uppercase">GROUNDED F1 LEGENDS WISDOM</h3>
                    <p className="text-xs text-slate-400">Channel racing philosophy from Formula 1 icons.</p>
                  </div>

                  {/* Legend Selector */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {['Ayrton Senna', 'Michael Schumacher', 'Niki Lauda', 'Alain Prost'].map(lg => (
                      <button
                        key={lg}
                        onClick={() => fetchLegendQuote(lg)}
                        className={`p-3 rounded-2xl border text-center transition-all font-racing font-bold text-xs ${selectedLegend === lg ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'bg-f1dark border-f1border text-slate-400 hover:text-white'}`}
                      >
                        {lg}
                      </button>
                    ))}
                  </div>

                  {/* Quote Output */}
                  <div className="p-6 bg-f1dark rounded-2xl border border-f1border flex flex-col items-center justify-center text-center gap-3 min-h-[160px]">
                    {isGeneratingLegend ? (
                      <span className="text-xs font-mono text-amber-400 animate-pulse">Channelling racing philosophy...</span>
                    ) : (
                      <>
                        <p className="text-sm font-racing italic text-slate-200 max-w-lg leading-relaxed">{legendQuote || `"If you no longer go for a gap that exists, you are no longer a racing driver."`}</p>
                        <span className="text-xs font-mono font-bold text-amber-400">— {selectedLegend}</span>
                      </>
                    )}
                  </div>
                </div>
              )}

              {/* TAB 6: GROUNDED 2026 REALTIME RESULTS */}
              {activeTab === 'GROUNDED_2026' && (
                <div className="bg-f1card p-6 rounded-3xl border border-f1border shadow-2xl flex flex-col gap-5">
                  <div className="flex items-center justify-between border-b border-f1border pb-3">
                    <div>
                      <h3 className="text-lg font-racing font-black text-white uppercase">2026 REALTIME F1 RESULTS</h3>
                      <p className="text-xs text-slate-400">Search-grounded Grand Prix victory and lap statistics.</p>
                    </div>

                    <button
                      onClick={fetchGrounded2026Results}
                      disabled={isFetchingGrounded}
                      className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-racing font-bold text-xs rounded-xl transition-all shadow cursor-pointer uppercase"
                    >
                      {isFetchingGrounded ? 'POLLING...' : 'FETCH LIVE 2026 RESULTS'}
                    </button>
                  </div>

                  <div className="flex flex-col gap-2">
                    {groundedResults.map((res, idx) => (
                      <div key={idx} className="p-3 bg-f1dark border border-f1border rounded-2xl flex items-center justify-between font-mono text-xs">
                        <div>
                          <span className="text-[10px] text-f1red font-bold uppercase block">{res.round}</span>
                          <span className="font-bold text-white text-sm">{res.gp}</span>
                        </div>
                        <div className="text-right">
                          <span className="text-emerald-400 font-bold block">{res.winner}</span>
                          <span className="text-[10px] text-slate-400">Fastest Lap: {res.fastestLap} ({res.gap})</span>
                        </div>
                      </div>
                    ))}
                    {groundedResults.length === 0 && <p className="text-xs text-slate-500 italic text-center py-4">Click button above to poll grounded 2026 Grand Prix standings!</p>}
                  </div>
                </div>
              )}

            </main>
          </div>

          {}
          <footer className="mt-12 bg-f1card border-t border-f1border p-8 text-slate-400">
            <div className="max-w-7xl mx-auto flex flex-col gap-6">
              <div className="border-b border-f1border pb-4">
                <h3 className="text-lg font-racing font-black text-white uppercase flex items-center gap-2">
                  <i className="fa-solid fa-circle-question text-f1red"></i> 20 COMPREHENSIVE FOLLOW-UP TECHNICAL QUESTIONS
                </h3>
                <p className="text-xs text-slate-400 mt-1">Explore further AI expansion, active aerodynamics, physics modeling, and multiplayer integration.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono leading-relaxed">
                <ol className="list-decimal list-inside flex flex-col gap-2 text-slate-300">
                  <li>How will active aero regulations in 2026 alter straight-line drag vs cornering downforce?</li>
                  <li>Can WebGL 3D shaders be integrated to visualize real-time tire thermal degradation maps?</li>
                  <li>How can we fine-tune Gemini system prompts to generate precise lap time telemetry deltas?</li>
                  <li>What mathematical formulas best simulate battery state-of-charge (MGU-K) harvesting cycles?</li>
                  <li>How can web socket connections sync multi-player ghost cars on the 2D track canvas?</li>
                  <li>Can we implement dynamic weather radar that changes surface grip coefficient mid-race?</li>
                  <li>How do altitude density variations in Mexico City affect turbocharger boost limits?</li>
                  <li>What pitch and frequency modulations will increase engine audio realism at 15,000 RPM?</li>
                  <li>How can pit stop minigame timing be benchmarked against real-world 1.80s pit stop records?</li>
                  <li>Can Google Search grounding extract real-time wind speed vectors during live GP sessions?</li>
                </ol>
                <ol start="11" className="list-decimal list-inside flex flex-col gap-2 text-slate-300">
                  <li>How do undercut and overcut tire strategies adapt when safety cars are deployed?</li>
                  <li>Can driver personality traits (e.g. aggressive vs conservative) modify AI pit calls?</li>
                  <li>How can we model brake temperature fade during heavy braking at Monza's Turn 1 chicane?</li>
                  <li>What UI animations best visualize slipstream suction vectors behind lead vehicles?</li>
                  <li>How can speech-to-text input enable voice radio communication directly to the AI Engineer?</li>
                  <li>Can we build custom 3D helmet design builders and export them as driver trading cards?</li>
                  <li>How does ERS manual boost override alter energy budgets over a 57-lap race distance?</li>
                  <li>What additional telemetry channels (G-force, steering angle, throttle) can be logged to CSV?</li>
                  <li>How can championship point standings recalculate dynamically after sprint race weekends?</li>
                  <li>Can haptic device feedback be triggered when vehicles hit high-curb apexes?</li>
                </ol>
              </div>

              <div className="text-center pt-4 border-t border-f1border text-[10px] text-slate-500">
                F1 2026 World Championship Simulator • Transformed from Soccer Design Template • Powered by Gemini AI
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
